<header>
    <h1>Settings</h1>
</header>

<main>
    <!-- Update Profile Section -->
    <section class="settings-section">
        <h2>Update Profile</h2>
        <form id="profile-form" action="update_profile.php" method="POST">
            <label for="student-name">Full Name:</label>
            <input type="text" id="student-name" name="student_name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <button type="submit">Save Changes</button>
        </form>
    </section>

    <!-- Change Password Section -->
    <section class="settings-section">
        <h2>Change Password</h2>
        <form id="password-form" action="update_password.php" method="POST">
            <label for="current-password">Current Password:</label>
            <input type="password" id="current-password" name="current_password" required>

            <label for="new-password">New Password:</label>
            <input type="password" id="new-password" name="new_password" required>

            <label for="confirm-password">Confirm New Password:</label>
            <input type="password" id="confirm-password" name="confirm_password" required>

            <button type="submit">Update Password</button>
        </form>
    </section>

    <!-- Notification Preferences Section -->
    <section class="settings-section">
        <h2>Notification Preferences</h2>
        <form id="notifications-form" action="update_notifications.php" method="POST">
            <label for="email-notifications">Email Notifications:</label>
            <select id="email-notifications" name="email_notifications">
                <option value="enabled">Enabled</option>
                <option value="disabled">Disabled</option>
            </select>

            <label for="sms-notifications">SMS Notifications:</label>
            <select id="sms-notifications" name="sms_notifications">
                <option value="enabled">Enabled</option>
                <option value="disabled">Disabled</option>
            </select>

            <button type="submit">Save Preferences</button>
        </form>
    </section>
</main>

<script>
    // Function to toggle the sidebar visibility
    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        sidebar.classList.toggle('hidden');
    }
    // Validate password fields before submission
    document.getElementById('password-form').addEventListener('submit', function(event) {
        let newPassword = document.getElementById('new-password').value;
        let confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword !== confirmPassword) {
            event.preventDefault();
            alert("Passwords do not match!");
        }
    });
</script>
